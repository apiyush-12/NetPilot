name: netpilot

x-node: &node
  build: .
  image: netpilot-node:local
  cap_add:
    - NET_ADMIN

services:
  client:
    <<: *node
    networks:
      client_lan:
        ipv4_address: 10.66.1.10

  router-a:
    <<: *node
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      client_lan:
        ipv4_address: 10.66.1.2
      server_lan:
        ipv4_address: 10.66.2.2

  router-b:
    <<: *node
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      client_lan:
        ipv4_address: 10.66.1.3
      server_lan:
        ipv4_address: 10.66.2.3

  server:
    <<: *node
    networks:
      server_lan:
        ipv4_address: 10.66.2.10

networks:
  client_lan:
    driver: bridge
    ipam:
      config:
        - subnet: 10.66.1.0/24

  server_lan:
    driver: bridge
    ipam:
      config:
        - subnet: 10.66.2.0/24